<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640"
     font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title">
  <title id="title">Bowlingbox targets and the libraries they link</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- White background so the picture reads in dark themes too. -->
  <rect width="720" height="640" fill="#fff"/>

  <!-- Links. An arrow points at the library being used; dotted = private. -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="310" y1="92"  x2="160" y2="160" marker-end="url(#arrow)"/>  <!-- BowlingGL -> Render -->
    <line x1="360" y1="92"  x2="360" y2="160" marker-end="url(#arrow)"/>  <!-- BowlingGL -> Audio -->
    <line x1="410" y1="92"  x2="560" y2="160" marker-end="url(#arrow)"/>  <!-- BowlingGL -> Alley -->

    <line x1="190" y1="232" x2="285" y2="315" marker-end="url(#arrow)"/>  <!-- Render -> Core -->
    <line x1="360" y1="232" x2="360" y2="300" marker-end="url(#arrow)"/>  <!-- Audio -> Core -->
    <line x1="530" y1="232" x2="435" y2="315" marker-end="url(#arrow)"/>  <!-- Alley -> Core -->

    <line x1="120" y1="232" x2="285" y2="440" marker-end="url(#arrow)"
          stroke-dasharray="5 4"/>                                         <!-- Render -> Score (private) -->
    <line x1="600" y1="232" x2="435" y2="440" marker-end="url(#arrow)"/>  <!-- Alley -> Score -->

    <line x1="330" y1="476" x2="250" y2="550"/>                            <!-- BowlingConsole uses Score -->
    <line x1="390" y1="476" x2="470" y2="550"/>                            <!-- BowlingDisplay uses Score -->
  </g>

  <!-- Boxes -->
  <g fill="#fff" stroke="#333" stroke-width="1.5">
    <rect x="260" y="20"  width="200" height="72" rx="4"/>  <!-- BowlingGL -->
    <rect x="20"  y="160" width="230" height="72" rx="4"/>  <!-- Render -->
    <rect x="285" y="160" width="150" height="72" rx="4"/>  <!-- Audio -->
    <rect x="470" y="160" width="230" height="72" rx="4"/>  <!-- Alley -->
    <rect x="285" y="300" width="150" height="56" rx="4"/>  <!-- Core -->
    <rect x="285" y="420" width="150" height="56" rx="4"/>  <!-- Score -->
    <rect x="135" y="550" width="180" height="56" rx="4"/>  <!-- BowlingConsole -->
    <rect x="405" y="550" width="180" height="72" rx="4"/>  <!-- BowlingDisplay -->
  </g>

  <!-- Labels: name, role, third-party code (italic) -->
  <g fill="#222" font-size="13" text-anchor="middle">
    <text x="360" y="44"  font-size="14" font-weight="bold">BowlingGL</text>
    <text x="360" y="62">3D game</text>
    <text x="360" y="80"  font-style="italic">wxWidgets + OpenGL</text>

    <text x="135" y="184" font-size="14" font-weight="bold">Render</text>
    <text x="135" y="202">3D scene + HUD</text>
    <text x="135" y="220" font-style="italic">OpenGL, GLAD, GLM, stb</text>

    <text x="360" y="184" font-size="14" font-weight="bold">Audio</text>
    <text x="360" y="202">sound output</text>
    <text x="360" y="220" font-style="italic">miniaudio</text>

    <text x="585" y="184" font-size="14" font-weight="bold">Alley</text>
    <text x="585" y="202">lane + throw rules</text>
    <text x="585" y="220" font-style="italic">Bullet3</text>

    <text x="360" y="324" font-size="14" font-weight="bold">Core</text>
    <text x="360" y="342">Result / Error</text>

    <text x="360" y="444" font-size="14" font-weight="bold">Score</text>
    <text x="360" y="462">scoring rules</text>

    <text x="225" y="574" font-size="14" font-weight="bold">BowlingConsole</text>
    <text x="225" y="592">text game</text>

    <text x="495" y="574" font-size="14" font-weight="bold">BowlingDisplay</text>
    <text x="495" y="592">score sheet window</text>
    <text x="495" y="610" font-style="italic">wxWidgets</text>
  </g>
</svg>
