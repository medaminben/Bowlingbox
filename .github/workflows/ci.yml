# Builds and tests Bowlingbox through buildkit's reusable CI workflow: configure,
# build and ctest with the "ci" preset (CMakePresets.json).
# Until buildkit is released as medaminben/buildkit v2.0.0, the workflow and
# buildkit itself come from unitpro's feature/buildkit branch.
name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: medaminben/unitpro/.github/workflows/ci.yml@feature/buildkit
    permissions:
      contents: read
    with:
      presets: "ci"
      compilers: "gcc"
      # wxWidgets with OpenGL (BowlingGL, BowlingDisplay), Bullet and glm as
      # installed packages, so nothing is built from source. GTK3 and the GL
      # headers stay for a wx source build. Audio needs no package: miniaudio
      # loads ALSA/PulseAudio at run time.
      apt-packages: "libwxgtk3.2-dev libgtk-3-dev libgl1-mesa-dev libbullet-dev libglm-dev"
      # buildkit's clang-format check would also check the vendored sources
      # in 3rdparty/ (glad, stb, miniaudio).
      lint: false
      static-analysis: false
      buildkit-repository: medaminben/unitpro
      buildkit-ref: feature/buildkit
