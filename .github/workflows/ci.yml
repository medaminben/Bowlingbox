name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      BUILD_DIR: build
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cache/fetchcontent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ninja-build \
            git \
            libgtk-3-dev \
            libgl1-mesa-dev

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: .cache/fetchcontent
          key: fetchcontent-v2-${{ runner.os }}-${{ hashFiles('cmake/GTestSupport.cmake', 'cmake/BulletSupport.cmake', 'cmake/GlmSupport.cmake', 'cmake/WxSupport.cmake') }}
          restore-keys: |
            fetchcontent-v2-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_QT_UI=OFF \
            -DBUILD_WX_UI=ON \
            -DBUILD_TESTING=ON \
            -DBUILD_APPS=ON \
            -DGENERATE_SCAFFOLD=OFF \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_BASE_DIR}"

      - name: Build
        run: cmake --build "${BUILD_DIR}" -j "$(nproc)"

      - name: Test
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --output-on-failure --label-regex unit
