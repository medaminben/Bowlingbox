# Builds and tests Bowlingbox through buildkit's reusable CI workflow: configure,
# build and ctest with the "ci" preset (CMakePresets.json: Debug, wx required,
# no scaffold), including the GUI tests (xvfb) and the install smoke test (ctest
# label "install").
# Each build job has buildkit's default time limit of 45 minutes.
name: CI

on:
  push:
    branches:
      - main
      - Beta
      - "feature/**"
  pull_request:
    branches:
      - main
      - Beta

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: medaminben/buildkit/.github/workflows/ci.yml@v2.0.0
    permissions:
      contents: read
    with:
      presets: "ci"
      compilers: "gcc"
      # wxWidgets with OpenGL (BowlingGL, BowlingDisplay), Bullet and glm as
      # installed packages, so nothing is built from source. GTK3 and the GL
      # headers stay for a wx source build. Audio needs no package: miniaudio
      # loads ALSA/PulseAudio at run time.
      apt-packages: "libwxgtk3.2-dev libgtk-3-dev libgl1-mesa-dev libbullet-dev libglm-dev"
      # Installs xvfb and runs ctest under xvfb-run, for the GUI tests.
      xvfb: true
      # clang-format stays off until the sources are checked against the style
      # (clang-format was not available where this was set up).
      lint-format: false
      lint-cmake: true
      lint-commits: true
      format-exclude: "3rdparty/**"
      static-analysis: false
