# Merges pull requests into main after the CI workflow succeeds on the PR head.
# Opt in by adding the "automerge" label to the PR (squash merge).
name: Automerge on green CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  automerge:
    runs-on: ubuntu-24.04
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge pull request
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequests = context.payload.workflow_run.pull_requests;
            if (!pullRequests?.length) {
              core.info('No pull request associated with this workflow run.');
              return;
            }

            const prNumber = pullRequests[0].number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.base.ref !== 'main') {
              core.info(`PR #${prNumber} targets ${pr.base.ref}, not main — skipping.`);
              return;
            }
            if (pr.merged) {
              core.info(`PR #${prNumber} is already merged.`);
              return;
            }
            if (pr.draft) {
              core.info(`PR #${prNumber} is a draft — skipping.`);
              return;
            }

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            if (!labels.some((l) => l.name === 'automerge')) {
              core.info(`PR #${prNumber} lacks the "automerge" label — skipping.`);
              return;
            }

            // Merge only the commit CI tested. If the PR moved on since, the
            // newer commit gets its own CI run and its own automerge attempt.
            const testedSha = context.payload.workflow_run.head_sha;
            if (pr.head.sha !== testedSha) {
              core.info(`PR #${prNumber} head ${pr.head.sha} is not the tested ${testedSha} — skipping.`);
              return;
            }

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'squash',
              sha: testedSha,  // GitHub refuses the merge if the head moved after this check
            });
            core.info(`Merged PR #${prNumber} (squash) after successful CI.`);
