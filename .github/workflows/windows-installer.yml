name: Windows installer

# version.yml calls this for every release it creates, with the new tag; the installer is
# then attached to that release. Run it by hand with no tag for a build of the current ref
# (workflow artifact only), or with an existing vX.Y.Z tag to attach one to that release.
on:
  workflow_call:
    inputs:
      tag:
        description: vX.Y.Z release to build and attach the installer to
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: vX.Y.Z release to attach the installer to (empty = artifact only)
        type: string
        required: false

# One build per tag or ref; a second release never cancels the first one's build.
concurrency:
  group: windows-installer-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write  # gh release upload

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0  # tags, for the version CMake reads

      - name: Setup MSYS2 (UCRT64 GCC, CMake, Ninja, binutils)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-binutils

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: .cache/fetchcontent
          key: fetchcontent-win-v1-${{ hashFiles('cmake/GTestSupport.cmake', 'cmake/BulletSupport.cmake', 'cmake/GlmSupport.cmake', 'cmake/WxSupport.cmake', 'cmake/windows-installer.cmake') }}
          restore-keys: |
            fetchcontent-win-v1-

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build, test, stage and package
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./scripts/build_windows_installer.ps1 `
            -FetchContentDir "${{ github.workspace }}/.cache/fetchcontent" `
            -InnoSetupDir "${env:ProgramFiles(x86)}\Inno Setup 6"

      # The stage check must reject what it exists to reject: a stale file, an
      # objdump output it cannot parse, and a foreign import, each by name.
      - name: Test the stage check
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./scripts/test_verify_installer_stage.ps1 `
            -AppDir build/windows/installer/stage/bin `
            -Objdump (Join-Path $env:MSYS2_LOCATION "ucrt64\bin\objdump.exe")

      - name: Upload staged folder
        uses: actions/upload-artifact@v4
        with:
          name: BowlingBox_stage
          path: build/windows/installer/stage/bin
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BowlingBox_Setup
          path: build/windows/dist/BowlingBox_Setup_*.exe
          if-no-files-found: error

      # The installer must carry the release's version: CMake read it from the checked-out
      # tag, so a mismatch means the wrong commit was built.
      - name: Attach installer to release
        if: inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          $installer = "build/windows/dist/BowlingBox_Setup_$($env:TAG.TrimStart('v')).exe"
          if (-not (Test-Path $installer)) {
            Get-ChildItem build/windows/dist | Format-Table Name -AutoSize
            throw "Expected $installer for release $env:TAG."
          }
          # The unversioned copy keeps releases/latest/download/BowlingBox_Setup.exe stable.
          New-Item -ItemType Directory -Force build/windows/dist/latest | Out-Null
          $latest = "build/windows/dist/latest/BowlingBox_Setup.exe"
          Copy-Item $installer $latest -Force
          gh release upload $env:TAG $installer $latest --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed for $env:TAG" }
          "Attached $(Split-Path $installer -Leaf) and BowlingBox_Setup.exe to release $env:TAG." >> $env:GITHUB_STEP_SUMMARY
