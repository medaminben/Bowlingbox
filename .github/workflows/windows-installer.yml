name: Windows installer

# Manual for now; building on each vX.Y.Z tag from version.yml is a follow-up.
on:
  workflow_dispatch:

concurrency:
  group: windows-installer
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the version CMake reads

      - name: Setup MSYS2 (UCRT64 GCC, CMake, Ninja, binutils)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-binutils

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: .cache/fetchcontent
          key: fetchcontent-win-v1-${{ hashFiles('cmake/GTestSupport.cmake', 'cmake/BulletSupport.cmake', 'cmake/GlmSupport.cmake', 'cmake/WxSupport.cmake', 'cmake/windows-installer.cmake') }}
          restore-keys: |
            fetchcontent-win-v1-

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build, test, stage and package
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./scripts/build_windows_installer.ps1 `
            -FetchContentDir "${{ github.workspace }}/.cache/fetchcontent" `
            -InnoSetupDir "${env:ProgramFiles(x86)}\Inno Setup 6"

      # The stage check must reject what it exists to reject: a stale file, an
      # objdump output it cannot parse, and a foreign import, each by name.
      - name: Test the stage check
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./scripts/test_verify_installer_stage.ps1 `
            -AppDir build/windows/installer/stage/bin `
            -Objdump (Join-Path $env:MSYS2_LOCATION "ucrt64\bin\objdump.exe")

      - name: Upload staged folder
        uses: actions/upload-artifact@v4
        with:
          name: BowlingBox_stage
          path: build/windows/installer/stage/bin
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BowlingBox_Setup
          path: build/windows/dist/BowlingBox_Setup_*.exe
          if-no-files-found: error
